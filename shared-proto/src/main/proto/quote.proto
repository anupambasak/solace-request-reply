// Contract of the Protobuf quote demo: request-reply/quote-protobuf/request and its replies.
//
// Both messages live in one file, so one registry artifact describes both; Apicurio writes the message
// type name ahead of every body, so a consumer knows which of the two it is holding.
syntax = "proto3";

package cris.prs.messaging.proto;

option java_package = "cris.prs.messaging.proto";
option java_multiple_files = true;
option java_outer_classname = "QuoteProtos";

// Who wants a quote: the Protobuf counterpart of cris.prs.messaging.Person.
message QuoteRequest {
  string person_name = 1;
  int32 age = 2;
}

// The quote: the Protobuf counterpart of cris.prs.messaging.Quote.
message QuoteReply {
  string id = 1;
  string person_name = 2;
  double amount = 3;
  string currency = 4;
  // Millisecond epoch at which the quote was produced.
  int64 quoted_at = 5;
}
