plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    alias(libs.plugins.gradleGitProperties)
    alias(libs.plugins.semverGitPlugin)
    alias(libs.plugins.springBoot) apply false
    alias(libs.plugins.springDependencyMgmt)
    alias(libs.plugins.sonarQubePlugin)
}

ext{
    set('hazelcast.version', libs.versions.hazelcastVersion.get())
}

semver {
    nextVersion = '0.1.0'
    snapshotSuffix = "SNAPSHOT"
    dirtyMarker = "-dirty"
    initialVersion = "0.1.0"
}

group 'cris.prs.msg'

jar {
    enabled = true
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        mavenBom "${libs.solaceSpringBootBom.get()}"
    }
}

gitProperties {
    extProperty = 'gitProps'
    if(!layout.projectDirectory.dir(".git").asFile.isDirectory()) {
        dotGitDirectory = layout.projectDirectory.dir("../git/modules/${rootProject.name}")
    }
}
generateGitProperties.outputs.upToDateWhen { false }

dependencies {
    annotationProcessor libs.lombok
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    compileOnly libs.lombok
    api libs.logbackClassic

    api 'org.springframework.boot:spring-boot-starter-actuator'
    // Micrometer and the Actuator health API are used only by the observability package, and every
    // bean that touches them is conditional, so an application without them still works.
    api 'io.micrometer:micrometer-core'
    api libs.solaceJavaStarter
    api 'org.springframework:spring-messaging'
    api 'org.springframework:spring-tx'
    api 'com.fasterxml.jackson.core:jackson-databind'

    // Apicurio Registry serdes are optional, like Micrometer: only the schema package uses them, and an
    // application adds the format modules it needs (Avro, Protobuf, JSON Schema). These are Apicurio's
    // generic, Kafka-free serde modules.
    compileOnly libs.apicurioSerdeAvro
    compileOnly libs.apicurioSerdeProtobuf
    compileOnly libs.apicurioSerdeJsonSchema

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // ApplicationContextRunner, with the AssertJ and spring-test classes it needs; as client and server use.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation libs.apicurioSerdeAvro
    testImplementation libs.apicurioSerdeProtobuf
    testImplementation libs.apicurioSerdeJsonSchema
}

test {
    useJUnitPlatform()
}

javadoc {
    options.encoding = 'UTF-8'
    // Lombok-generated members are invisible to javadoc, so never {@link} to one: the reference
    // cannot be resolved and doclint reports it as an error.
    options.addStringOption('Xdoclint:all', '-quiet')
    options.addStringOption('Xmaxwarns', '1000')
}