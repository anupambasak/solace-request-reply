server:
  port: 8080

app:
  # request-reply: shared request endpoint, reply to the requester's own destination
  request:
    queue: request-reply-queue-1
    group: request-reply-group-1
    topic: request-reply/request-1
    concurrency: 10
    # Consume the request and publish the reply in one Solace local transaction
    transactional: true

  # request-reply, service two: its own endpoint AND its own request topic. Two queues subscribed to
  # the same topic would each get a copy, so both services would answer the same request.
  quote:
    queue: request-reply-queue-2
    group: request-reply-group-2
    topic: request-reply/request-2
    concurrency: 5
    transactional: true

  # request-reply, service three: inventory. Its replies go to a reply destination of the client's
  # own choosing -- nothing here decides that; the container publishes to the request's replyTo.
  inventory:
    queue: request-reply-queue-3
    group: request-reply-group-3
    topic: request-reply/request-3
    concurrency: 5
    transactional: true

  # publish-subscribe: every instance binds its own endpoint and receives every notification
  notification:
    queue: notification
    topic: notification/broadcast

  # point-to-point: all instances compete over the one shared endpoint task.workers
  task:
    queue: task
    group: workers
    topic: task/submit
    concurrency: 5
    transactional: true

solace:
  # Broker connection: solace-java-spring-boot-starter
  java:
#    host: tcp://broker-pubsubplus:55555
    host: tcp://10.74.24.23:55555
    msgVpn: default
    clientUsername: default
    clientPassword: default
    connectRetries: -1
    reconnectRetries: -1

  template:
    delivery-mode: PERSISTENT
    dmq-eligible: true

  listener:
    endpoint-mode: DURABLE_QUEUE
    # A transactional container takes one transacted session per flow, and Solace allows 10 per
    # client connection by default. Each transactional container therefore opens its own connection,
    # so this only has to fit within the limit per container, not across all of them.
    concurrency: 10
    max-transacted-sessions-per-connection: 10
    transactional: true
    # INLINE runs the listener on the JCSMP delivery thread. EXECUTOR would hand it to the
    # solaceListenerTaskExecutor instead, but it is rejected while transactional is true: a Solace
    # transacted session must be driven by the thread its messages arrive on, because commit()
    # acknowledges everything delivered on that session, not just the message being handled.
    dispatch: INLINE
    keep-alive: true
    provision-endpoint: true
    endpoint:
      access-type: NONEXCLUSIVE
      permission: MODIFY_TOPIC
      quota-mb: 100
      respects-ttl: true
      # A transactional listener rolls back on failure, so a message it can never handle would be
      # redelivered forever. After this many attempts the broker parks it on the dead message queue
      # instead. 0 keeps the broker default of retrying without limit.
      max-redelivery-count: 5
      dead-message-queue:
        provision: true
        name: "#DEAD_MSG_QUEUE"
        quota-mb: 100

  # The server never originates requests, so it needs no reply container.
  request-reply:
    enabled: false

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: '*'
  info:
    git:
      mode: full
