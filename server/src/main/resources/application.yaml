server:
  port: 8080

spring:
  cloud:
    function:
      definition: booking
    stream:
      bindings:
        booking-in-0:
          destination: bkg
          group: bkgGrp
          consumer:
            concurrency: 10
      binders:
        local-solace:
          type: solace
          environment:
            solace:
              java:
                host: tcp://broker-pubsubplus:55555
                msgVpn: default
                clientUsername: default
                clientPassword: default
      solace:
        bindings:
          booking-in-0:
            consumer:
              queueAdditionalSubscriptions:
                - bkg/trn
                - bkg/trn/>

