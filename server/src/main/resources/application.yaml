server:
  port: 8080

app:
  # request-reply: shared request endpoint, reply to the requester's own destination
  request:
    queue: request-reply-queue-1
    group: request-reply-group-1
    topic: request-reply/request-1
    concurrency: 10
    # Consume the request and publish the reply in one Solace local transaction
    transactional: true

  # request-reply, service two: its own endpoint AND its own request topic. Two queues subscribed to
  # the same topic would each get a copy, so both services would answer the same request.
  quote:
    queue: request-reply-queue-2
    group: request-reply-group-2
    topic: request-reply/request-2
    concurrency: 5
    transactional: true

  # request-reply, schema registry demos: the quote service again, with the payloads as Avro (the shared
  # DTOs, by reflection), as Protobuf (generated from shared-proto/src/main/proto/quote.proto) and as JSON
  # validated against a registered JSON Schema (the shared DTOs again, written by the application's own
  # ObjectMapper). Each has its own endpoint and request topic; the formats and artifacts are under
  # solace.schema-registry.
  quote-avro:
    queue: request-reply-queue-4
    group: request-reply-group-4
    topic: request-reply/quote-avro/request
    concurrency: 5
    transactional: true
  quote-protobuf:
    queue: request-reply-queue-5
    group: request-reply-group-5
    topic: request-reply/quote-protobuf/request
    concurrency: 5
    transactional: true
  quote-jsonschema:
    queue: request-reply-queue-6
    group: request-reply-group-6
    topic: request-reply/quote-jsonschema/request
    concurrency: 5
    transactional: true

  # request-reply, service three: inventory. Its replies go to a reply destination of the client's
  # own choosing -- nothing here decides that; the container publishes to the request's replyTo.
  inventory:
    queue: request-reply-queue-3
    group: request-reply-group-3
    topic: request-reply/request-3
    concurrency: 5
    transactional: true

  # publish-subscribe: every instance binds its own endpoint and receives every notification
  notification:
    queue: notification
    topic: notification/broadcast

  # point-to-point: all instances compete over the one shared endpoint task.workers
  task:
    queue: task
    group: workers
    topic: task/submit
    concurrency: 5
    transactional: true

  # topic dispatch: three handler methods share this one endpoint, routed by matched subscription
  router:
    queue: notification-router
    group: v1
    topic-prefix: routed

solace:
  # Broker connection: solace-java-spring-boot-starter
  java:
#    host: tcp://broker-pubsubplus:55555
    host: tcp://10.74.24.23:55555
    msgVpn: default
    clientUsername: default
    clientPassword: default
    connectRetries: -1
    reconnectRetries: -1

  template:
    delivery-mode: PERSISTENT
    dmq-eligible: true

  listener:
    endpoint-mode: DURABLE_QUEUE
    # A transactional container takes one transacted session per flow, and Solace allows 10 per
    # client connection by default. Each transactional container therefore opens its own connection,
    # so this only has to fit within the limit per container, not across all of them.
    concurrency: 10
    max-transacted-sessions-per-connection: 10
    transactional: true
    # INLINE runs the listener on the JCSMP delivery thread. EXECUTOR would hand it to the
    # solaceListenerTaskExecutor instead, but it is rejected while transactional is true: a Solace
    # transacted session must be driven by the thread its messages arrive on, because commit()
    # acknowledges everything delivered on that session, not just the message being handled.
    dispatch: INLINE
    # What happens to a message whose listener throws. ACCEPTED keeps the historical behaviour:
    # the failure is recorded and the message is dropped. FAILED hands it back for redelivery and
    # counts the attempt; REJECTED sends it straight to the dead message queue without burning
    # through max-redelivery-count first. Both of those need the flow to negotiate the outcome at
    # bind time, which the container derives from this value.
    # Note: ignored on a transactional container, where the rollback governs redelivery — every
    # request-reply listener here is transactional, so this applies to the non-transactional ones.
    error-outcome: ACCEPTED
    keep-alive: true
    # Per-flow tuning. Every value is unset by default, meaning JCSMP's own defaults; a property
    # reaches the flow only once given a value. The whole block is commented out because a `flow:`
    # key with no children binds as an empty string, not as an empty object, and fails at startup.
    # flow:
    #   transport-window-size: 255      # messages in flight before the broker waits for an ack
    #   ack-threshold: 60               # percentage of the window at which the flow acknowledges
    #   ack-timer: 1s                   # floor on ack latency for a slow trickle of messages
    #   reconnect-tries: -1             # -1 retries a lost flow forever
    #   reconnect-retry-interval: 3s
    #   active-flow-indication: true    # unset derives it: on for EXCLUSIVE endpoints
    provision-endpoint: true
    endpoint:
      access-type: NONEXCLUSIVE
      permission: MODIFY_TOPIC
      quota-mb: 100
      respects-ttl: true
      # A transactional listener rolls back on failure, so a message it can never handle would be
      # redelivered forever. After this many attempts the broker parks it on the dead message queue
      # instead. 0 keeps the broker default of retrying without limit.
      max-redelivery-count: 5
      dead-message-queue:
        provision: true
        name: "#DEAD_MSG_QUEUE"
        quota-mb: 100

  # Schema registry: Apicurio Registry, used by the Avro and Protobuf quote demos only.
  # Nothing contacts the registry at startup; each serde is created on the first message that needs it.
  schema-registry:
    url: ${APICURIO_REGISTRY_URL:http://api-apicurio-apps-dev.ocptnd1.prs/apis/registry/v3}
    formats: [AVRO, PROTOBUF, JSON_SCHEMA]
    # POJOs are governed only on the Avro and JSON Schema demos' topics; every other exchange keeps
    # sending plain, unvalidated JSON. (Protobuf messages are generated classes, recognised wherever
    # they are sent.)
    destinations:
      - "request-reply/quote-avro/>"
      - "request-reply/quote-jsonschema/>"
    # A dev registry: register a schema the first time it is used. In production, register from CI.
    auto-register: true
    # Map topics to registry artifacts. Reply topics end in the requester's instance id, so they are
    # mapped by prefix with '>' -- one artifact for every client pod, not one per pod.
    topic-profile:
      - topic-expression: "request-reply/quote-avro/request"
        group-id: solace-request-reply
        artifact-id: quote-avro-request
        format: AVRO
      - topic-expression: "request-reply/quote-avro/reply/>"
        group-id: solace-request-reply
        artifact-id: quote-avro-reply
        format: AVRO
      - topic-expression: "request-reply/quote-protobuf/request"
        group-id: solace-request-reply
        artifact-id: quote-protobuf-request
      - topic-expression: "request-reply/quote-protobuf/reply/>"
        group-id: solace-request-reply
        artifact-id: quote-protobuf-reply
      # No format: a governed topic whose mapping does not name one is JSON Schema.
      - topic-expression: "request-reply/quote-jsonschema/request"
        group-id: solace-request-reply
        artifact-id: quote-jsonschema-request
      - topic-expression: "request-reply/quote-jsonschema/reply/>"
        group-id: solace-request-reply
        artifact-id: quote-jsonschema-reply
    avro:
      # Lets the shared DTOs (Person, Quote) travel as Avro unchanged, with a schema derived from their
      # fields; ALLOW_NULL makes every field nullable, so a missing name does not fail serialisation.
      datum-provider: REFLECT_ALLOW_NULL
      # Avro only instantiates classes it trusts. Payload and listener types are trusted automatically;
      # this covers anything nested inside them.
      trusted-packages: [cris.prs.messaging]
    # Publishing the demo's JSON Schemas. JSON Schema is the one format Apicurio cannot derive from the
    # data, so auto-register has nothing to register and the artifacts have to exist before the first
    # message. The library publishes them from shared-dto's classpath:schemas/*.json.
    registration:
      # STARTUP publishes them as the application initialises, so a bad or unreachable schema shows up at
      # boot. FIRST_MESSAGE -- the default -- waits until the first message that actually uses the
      # registry, so an instance still starts while the registry is down.
      mode: STARTUP
      # With fail-fast off (the default), a failed attempt is a warning and the first message tries again.
      fail-fast: false
      schemas:
        - artifact-id: quote-jsonschema-request
          group-id: solace-request-reply
          format: JSON_SCHEMA
          location: "classpath:schemas/quote-jsonschema-request.json"
        - artifact-id: quote-jsonschema-reply
          group-id: solace-request-reply
          format: JSON_SCHEMA
          location: "classpath:schemas/quote-jsonschema-reply.json"
    json-schema:
      # Check every payload against its schema on the way out and on the way in. This is the whole point
      # of the format: the bytes are the same JSON as an ungoverned exchange, the contract is what is new.
      validation: true
      properties:
        # find-latest makes the serde resolve the registered artifacts by their coordinates -- group,
        # artifact id, newest version -- rather than by looking up a schema it cannot produce from the
        # data. Set here, on the JSON Schema serde alone, so Avro and Protobuf keep resolving by content.
        "[apicurio.registry.find-latest]": "true"

  # The server never originates requests, so it needs no reply container.
  request-reply:
    enabled: false

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
      group:
        # The Solace indicator belongs in readiness, so a broker outage takes the instance out of
        # the load balancer — and deliberately NOT in liveness, where it would restart-loop every pod.
        readiness:
          include: readinessState,solace
  info:
    git:
      mode: full
