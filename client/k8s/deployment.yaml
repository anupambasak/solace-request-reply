apiVersion: v1
kind: Service
metadata:
  annotations:
    cis.f5.com/health: '{"interval": 5, "timeout": 10}'
    cis.f5.com/ipamLabel: TND
  namespace: anupam
  name: client
  labels:
    app: client
spec:
  type: LoadBalancer
  selector:
    app: client
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: anupam
  name: client
  labels:
    app: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
      annotations:
        openshift.io/required-scc: "apos-application-scc"
    spec:
      containers:
        - name: client
          image: client
          imagePullPolicy: Always
          env:
            - name: JAVA_OPTS
              value: |
                --add-modules java.se --add-exports java.base/jdk.internal.ref=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED 
                --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED --add-opens java.management/sun.management=ALL-UNNAMED 
                --add-opens jdk.management/com.sun.management.internal=ALL-UNNAMED -XX:+ExitOnOutOfMemoryError
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
      imagePullSecrets:
        - name: basak-anupam-pull-secret