server:
  port: 8080

app:
  request:
    topic: request-reply/request-1
  quote:
    topic: request-reply/request-2
  # Inventory has its own reply destination rather than the shared one, so its replies are isolated
  # from booking's and quote's: no head-of-line blocking between them, no shared blast radius, and
  # depth and latency readable on their own.
  inventory:
    topic: request-reply/request-3
    reply-topic-prefix: request-reply/reply-3
    # The reply endpoint is a non-durable (temporary) queue, and a temporary queue accepts exactly
    # one flow. Raising this needs a durable reply queue first.
    reply-concurrency: 1
    reply-timeout: 30s
  notification:
    topic: notification/broadcast
  task:
    topic: task/submit

solace:
  # Broker connection: solace-java-spring-boot-starter
  java:
#    host: tcp://broker-pubsubplus:55555
    host: tcp://10.74.24.23:55555
    msgVpn: default
    clientUsername: default
    clientPassword: default
    connectRetries: -1
    reconnectRetries: -1

  # Identifier used to make this pod's reply destination unique.
  # Defaults to $HOSTNAME, then $POD_NAME, then the local host name.
  # instance-id: ${HOSTNAME}

  template:
    delivery-mode: PERSISTENT
    dmq-eligible: true

  request-reply:
    enabled: true
    # Replies for this pod arrive on <reply-topic-prefix>/<instance-id>, e.g. request-reply/reply-1/client-7d9f4-abcde
    reply-topic-prefix: request-reply/reply-1
    append-instance-id: true
    # NON_DURABLE_QUEUE: guaranteed delivery on a temporary endpoint the broker removes on disconnect.
    # DURABLE_QUEUE:     survives restarts, endpoint named request-reply.reply-1.<instance-id>.
    # DIRECT:            non-persistent topic subscription, lowest latency, at-most-once.
    endpoint-mode: NON_DURABLE_QUEUE
    concurrency: 1
    reply-timeout: 30s
    delivery-mode: PERSISTENT

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
      group:
        # The Solace indicator belongs in readiness, so a broker outage takes the instance out of
        # the load balancer — and deliberately NOT in liveness, where it would restart-loop every pod.
        readiness:
          include: readinessState,solace
  info:
    git:
      mode: full
