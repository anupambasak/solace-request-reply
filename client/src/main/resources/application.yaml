server:
  port: 8080

app:
  request:
    topic: request-reply/request-1
  quote:
    topic: request-reply/request-2
  # Inventory has its own reply destination rather than the shared one, so its replies are isolated
  # from booking's and quote's: no head-of-line blocking between them, no shared blast radius, and
  # depth and latency readable on their own.
  inventory:
    topic: request-reply/request-3
    reply-topic-prefix: request-reply/reply-3
    # The reply endpoint is a non-durable (temporary) queue, and a temporary queue accepts exactly
    # one flow. Raising this needs a durable reply queue first.
    reply-concurrency: 1
    reply-timeout: 30s
  # Schema registry demos: the quote service with Avro, Protobuf and JSON Schema payloads. Each has its own
  # reply destination, because a shared one carries replies of several types and no single topic-to-schema
  # mapping fits them all. The formats and artifacts are under solace.schema-registry.
  quote-avro:
    topic: request-reply/quote-avro/request
    reply-topic-prefix: request-reply/quote-avro/reply
    reply-concurrency: 1
    reply-timeout: 30s
  quote-protobuf:
    topic: request-reply/quote-protobuf/request
    reply-topic-prefix: request-reply/quote-protobuf/reply
    reply-concurrency: 1
    reply-timeout: 30s
  quote-jsonschema:
    topic: request-reply/quote-jsonschema/request
    reply-topic-prefix: request-reply/quote-jsonschema/reply
    reply-concurrency: 1
    reply-timeout: 30s
  notification:
    topic: notification/broadcast
  task:
    topic: task/submit

solace:
  # Broker connection: solace-java-spring-boot-starter
  java:
#    host: tcp://broker-pubsubplus:55555
    host: tcp://10.74.24.23:55555
    msgVpn: default
    clientUsername: default
    clientPassword: default
    connectRetries: -1
    reconnectRetries: -1

  # Identifier used to make this pod's reply destination unique.
  # Defaults to $HOSTNAME, then $POD_NAME, then the local host name.
  # instance-id: ${HOSTNAME}

  template:
    delivery-mode: PERSISTENT
    dmq-eligible: true

  request-reply:
    enabled: true
    # Replies for this pod arrive on <reply-topic-prefix>/<instance-id>, e.g. request-reply/reply-1/client-7d9f4-abcde
    reply-topic-prefix: request-reply/reply-1
    append-instance-id: true
    # NON_DURABLE_QUEUE: guaranteed delivery on a temporary endpoint the broker removes on disconnect.
    # DURABLE_QUEUE:     survives restarts, endpoint named request-reply.reply-1.<instance-id>.
    # DIRECT:            non-persistent topic subscription, lowest latency, at-most-once.
    endpoint-mode: NON_DURABLE_QUEUE
    concurrency: 1
    reply-timeout: 30s
    delivery-mode: PERSISTENT
    # Expire a request when its requester stops waiting for the answer. Without this, a request published
    # while the server is restarting waits on the durable queue, is handled whenever the server returns,
    # and the reply arrives long after the future timed out ("Received a reply with no outstanding
    # request"). The request endpoints are provisioned respects-ttl with a dead message queue, so an
    # expired request is parked there instead of being answered far too late. Keep it equal to
    # reply-timeout. The other reply templates set the same thing on their ReplyEndpointSpec; anything a
    # spec leaves unset falls back to solace.template.* (priority, dmq-eligible).
    time-to-live: 30000

  # Schema registry: Apicurio Registry, used by the Avro and Protobuf quote demos only.
  # Nothing contacts the registry at startup; each serde is created on the first message that needs it.
  schema-registry:
    url: ${APICURIO_REGISTRY_URL:http://api-apicurio-apps-dev.ocptnd1.prs/apis/registry/v3}
    formats: [AVRO, PROTOBUF, JSON_SCHEMA]
    # POJOs are governed only on the Avro and JSON Schema demos' topics; every other exchange keeps
    # sending plain, unvalidated JSON. (Protobuf messages are generated classes, recognised wherever
    # they are sent.)
    destinations:
      - "request-reply/quote-avro/>"
      - "request-reply/quote-jsonschema/>"
    # A dev registry: register a schema the first time it is used. In production, register from CI.
    auto-register: true
    # Map topics to registry artifacts. Reply topics end in the requester's instance id, so they are
    # mapped by prefix with '>' -- one artifact for every client pod, not one per pod.
    topic-profile:
      - topic-expression: "request-reply/quote-avro/request"
        group-id: solace-request-reply
        artifact-id: quote-avro-request
        format: AVRO
      - topic-expression: "request-reply/quote-avro/reply/>"
        group-id: solace-request-reply
        artifact-id: quote-avro-reply
        format: AVRO
      - topic-expression: "request-reply/quote-protobuf/request"
        group-id: solace-request-reply
        artifact-id: quote-protobuf-request
      - topic-expression: "request-reply/quote-protobuf/reply/>"
        group-id: solace-request-reply
        artifact-id: quote-protobuf-reply
      # No format: a governed topic whose mapping does not name one is JSON Schema.
      - topic-expression: "request-reply/quote-jsonschema/request"
        group-id: solace-request-reply
        artifact-id: quote-jsonschema-request
      - topic-expression: "request-reply/quote-jsonschema/reply/>"
        group-id: solace-request-reply
        artifact-id: quote-jsonschema-reply
    avro:
      # Lets the shared DTOs (Person, Quote) travel as Avro unchanged, with a schema derived from their
      # fields; ALLOW_NULL makes every field nullable, so a missing name does not fail serialisation.
      datum-provider: REFLECT_ALLOW_NULL
      # Avro only instantiates classes it trusts. Payload and listener types are trusted automatically;
      # this covers anything nested inside them.
      trusted-packages: [cris.prs.messaging]
    # Publishing the demo's JSON Schemas. JSON Schema is the one format Apicurio cannot derive from the
    # data, so auto-register has nothing to register and the artifacts have to exist before the first
    # message. The library publishes them from shared-dto's classpath:schemas/*.json.
    registration:
      # STARTUP publishes them as the application initialises, so a bad or unreachable schema shows up at
      # boot. FIRST_MESSAGE -- the default -- waits until the first message that actually uses the
      # registry, so an instance still starts while the registry is down.
      mode: STARTUP
      # With fail-fast off (the default), a failed attempt is a warning and the first message tries again.
      fail-fast: false
      schemas:
        - artifact-id: quote-jsonschema-request
          group-id: solace-request-reply
          format: JSON_SCHEMA
          location: "classpath:schemas/quote-jsonschema-request.json"
        - artifact-id: quote-jsonschema-reply
          group-id: solace-request-reply
          format: JSON_SCHEMA
          location: "classpath:schemas/quote-jsonschema-reply.json"
    json-schema:
      # Check every payload against its schema on the way out and on the way in. This is the whole point
      # of the format: the bytes are the same JSON as an ungoverned exchange, the contract is what is new.
      validation: true
      properties:
        # find-latest makes the serde resolve the registered artifacts by their coordinates -- group,
        # artifact id, newest version -- rather than by looking up a schema it cannot produce from the
        # data. Set here, on the JSON Schema serde alone, so Avro and Protobuf keep resolving by content.
        "[apicurio.registry.find-latest]": "true"

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
      group:
        # The Solace indicator belongs in readiness, so a broker outage takes the instance out of
        # the load balancer — and deliberately NOT in liveness, where it would restart-loop every pod.
        readiness:
          include: readinessState,solace
  info:
    git:
      mode: full
